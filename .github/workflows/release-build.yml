name: Build & Release Windows

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'tools/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v0.1.0, latest)'
        required: false
        default: 'latest'

permissions:
  contents: write

# A newer push supersedes a running build of the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # game-ci runs Unity in Docker, which windows-latest cannot do (no daemon).
    # Build the Windows player on Linux and package it on Windows below.
    name: Build Unity Windows player
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # Every build gets its own version (base major.minor + run number) so the in-game updater can tell
      # builds apart and the network version check keeps mismatched builds apart.
      - name: Stamp build version
        id: version
        run: |
          asset=Assets/_Project/Data/Config/GameConfig.asset
          base=$(grep -m1 '_gameVersion:' "$asset" | sed 's/.*: *//' | tr -d '\r"')
          version="${base%.*}.${{ github.run_number }}"
          sed -i "s/^\( *_gameVersion:\).*/\1 $version/" "$asset"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Linux-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Linux-

      - name: Build Unity StandaloneWindows64
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          # The stamp step above dirties GameConfig.asset on purpose; skip game-ci's git-based versioning.
          versioning: None
          buildMethod: GraceRun.Editor.BuildMenu.BuildWindowsCli
          buildsPath: Builds
          buildName: Boplborne

      - name: Upload player build
        uses: actions/upload-artifact@v4
        with:
          name: windows-player
          path: Builds/Windows
          if-no-files-found: error
          compression-level: 0

  release:
    name: Package Single EXE & Publish
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download player build
        uses: actions/download-artifact@v4
        with:
          name: windows-player
          path: Builds/Windows

      - name: Read game version from GameConfig.asset
        id: version
        shell: pwsh
        run: |
          $version = "${{ needs.build.outputs.version }}"
          # The tag is always v<stamped version>: the in-game updater compares it with the running build's version.
          $tagName = "v$version"
          echo "game_version=$version" >> $env:GITHUB_OUTPUT
          echo "tag_name=$tagName" >> $env:GITHUB_OUTPUT
          Write-Host "Detected GameVersion: $version (Release Tag: $tagName)"

      - name: Package into single self-extracting Boplborne.exe
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.game_version }}"
          pwsh -NoProfile -ExecutionPolicy Bypass -File .github/scripts/Pack-SingleExe.ps1 -Version $version
          echo "single_exe=Builds/Release/Boplborne_v${version}_SingleFile.exe" >> $env:GITHUB_OUTPUT
          echo "portable_zip=Builds/Release/Boplborne_v${version}_Portable.zip" >> $env:GITHUB_OUTPUT

      - name: Upload Single-EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Boplborne-v${{ steps.version.outputs.game_version }}-SingleFile
          path: ${{ steps.package.outputs.single_exe }}

      - name: Write release notes
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.game_version }}"
          $notes = @(
            "## Boplborne v$v",
            "Automated build from commit ``${{ github.sha }}``.",
            "",
            "### Downloads",
            "- **``Boplborne_v${v}_SingleFile.exe``**: single file, download and double-click to play (also takes flags like ``-screen-fullscreen 0 -screen-width 1280 -screen-height 720`` or ``-connect <ip>``).",
            "- **``Boplborne_v${v}_Portable.zip``**: the same game as a folder; unzip anywhere and run ``Boplborne.exe``.",
            "",
            "---",
            ""
          ) -join "`n"
          $howTo = Get-Content docs/HOW_TO_PLAY.md -Raw
          Set-Content -Path release-notes.md -Value ($notes + "`n" + $howTo) -Encoding utf8

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Boplborne ${{ steps.version.outputs.tag_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            ${{ steps.package.outputs.single_exe }}
            ${{ steps.package.outputs.portable_zip }}
